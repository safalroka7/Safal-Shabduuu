<html lang="en"><head><meta charset="utf-8">

<title>Safal & Shabda</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#bff3e6;--bg2:#ffd9ec;--ink:#3b2a4a;--card:rgba(255,255,255,.85)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1e4a47;--bg2:#4a2a4a;--ink:#fff;--card:rgba(40,30,50,.8)}}
:root[data-theme="dark"]{--bg1:#1e4a47;--bg2:#4a2a4a;--ink:#fff;--card:rgba(40,30,50,.8)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink)}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
#top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;text-align:center;pointer-events:none}
#top h1{margin:0;font-size:22px}#top p{margin:4px 0 0;font-size:14px;opacity:.8}
.name{position:absolute;transform:translate(-50%,0);padding:4px 12px;border-radius:99px;background:var(--card);font-weight:700;font-size:14px;pointer-events:none;transition:.2s}
.name.sel{background:#ff7eb6;color:#fff;transform:translate(-50%,0) scale(1.15)}
#bar{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 8px}
#bar button{border:0;border-radius:18px;background:var(--card);color:var(--ink);padding:10px 12px;font-size:15px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.15);min-width:64px}
#bar button:active{transform:scale(.92)}#bar button:disabled{opacity:.5}
#bar span{display:block;font-size:24px}
.fx{position:absolute;pointer-events:none;font-size:28px;animation:fl 1.6s ease-out forwards}
@keyframes fl{to{transform:translate(var(--dx),-130px) scale(1.5) rotate(var(--r));opacity:0}}
.pop{position:absolute;pointer-events:none;font-size:34px;font-weight:900;color:#fff;-webkit-text-stroke:2px #ff4f93;paint-order:stroke fill;animation:pp 1.2s ease-out forwards}
@keyframes pp{0%{transform:translate(-50%,0) scale(.3)}25%{transform:translate(-50%,-20px) scale(1.3)}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
